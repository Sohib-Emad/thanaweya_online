name: thanaweya_online
description: "Thanaweya Online - Educational Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  supabase_flutter: ^2.8.4
  youtube_player_flutter: ^9.1.1
  flutter_inappwebview: ^6.1.5
  fl_chart: ^0.70.2
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.3
  google_fonts: ^6.2.1
  intl: ^0.20.2
  flutter_screenutil: ^5.9.3
  flutter_dotenv: ^5.2.1
  equatable: ^2.0.7
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  audioplayers: ^6.1.0
  lottie: ^3.1.2
  image_picker: ^1.1.2
  video_player: ^2.13.0
  url_launcher: ^6.3.2
  file_picker: ^10.1.2
  qr_flutter: ^4.1.0
  qr_code_scanner_plus: ^2.0.4
  pdf: ^3.11.1
  printing: ^5.13.2
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.2.7
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.8.0
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/icon_Thanaweya_Online.png
  color_dark: "#FFFFFF"
  image_dark: assets/icons/icon_Thanaweya_Online.png
  android_12:
    image: assets/icons/icon_Thanaweya_Online.png
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
  web: false

flutter:
  uses-material-design: true
  generate: true

  config:
    enable-swift-package-manager: false

  assets:
    - assets/icons/
    - assets/images/
    - assets/sounds/
    - assets/json/
    - .env

